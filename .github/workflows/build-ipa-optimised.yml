name: Build IPA from your own Spotify IPA (optimised)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      use_alt_name:
        description: "Name it as a TestFlight build"
        default: false
        type: boolean
      release_notes:
        description: "Extra text for the release description"
        default: ""
        required: false
        type: string
      upload_local:
        description: "Upload to this channel"
        default: true
        required: true
        type: boolean
      upload_to_alt_repo:
        description: "Multi Upload"
        default: false
        required: true
        type: boolean

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Mask IPA link
        run: |
          URL="$(jq -r '.inputs.ipa_url // empty' "$GITHUB_EVENT_PATH")"
          [ -z "$URL" ] || echo "::add-mask::$URL"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download IPA and install tools
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -eo pipefail
          JOBS="$RUNNER_TEMP/jobs"; : > "$JOBS"

          bg() {
            local name="$1"; shift
            ( "$@" ) > "$RUNNER_TEMP/$name.log" 2>&1 &
            echo "$! $name" >> "$JOBS"
          }

          fetch_ipa() {
            mkdir -p ipa
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$IPA_URL" -o ipa/spotify.ipa
            case "$(file --mime-type -b ipa/spotify.ipa)" in
              application/zip|application/x-ios-app) ;;
              *) echo "::error::Not an IPA"; return 1 ;;
            esac
          }

          install_brew() {
            brew install --quiet make dpkg ldid
          }

          install_cyan() {
            python3 -m pip install --quiet --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          }

          install_ipapatch() {
            local suffix=macos-arm64
            [ "$(uname -m)" = "x86_64" ] && suffix=macos-amd64
            sudo curl -fsSL --retry 3 \
              "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${suffix}" \
              -o /usr/local/bin/ipapatch
            sudo chmod +x /usr/local/bin/ipapatch
          }

          bg ipa      fetch_ipa
          bg brew     install_brew
          bg cyan     install_cyan
          bg ipapatch install_ipapatch

          failed=0
          while read -r pid name; do
            if wait "$pid"; then
              echo "::group::$name ok"
            else
              echo "::group::$name FAILED"; failed=1
            fi
            cat "$RUNNER_TEMP/$name.log"
            echo "::endgroup::"
          done < "$JOBS"

          [ "$failed" -eq 0 ] || { echo "::error::a download or install failed"; exit 1; }

      - name: Name the build
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          USE_ALT_NAME: ${{ inputs.use_alt_name }}
        run: |
          set -eo pipefail

          FILE="${IPA_URL##*/}"; FILE="${FILE%%[?#]*}"
          PREFIX=EeveeSpotify
          SPOT_VERSION=""
          if [[ "$FILE" =~ ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            SPOT_VERSION="${BASH_REMATCH[1]}"
            PREFIX=TestFlight-ES
            echo "found testflight version in the file name: $SPOT_VERSION"
          elif [ "$USE_ALT_NAME" = "true" ]; then
            PREFIX=TestFlight-ES
          fi

          APP_DIR="$(unzip -Z1 ipa/spotify.ipa | grep -oE '^Payload/[^/]+\.app/' | sort -u | head -1)"
          [ -n "$APP_DIR" ] || { echo "::error::no Payload/*.app in the IPA"; exit 1; }
          unzip -p ipa/spotify.ipa "${APP_DIR}Info.plist" > "$RUNNER_TEMP/Info.plist"
          [ -n "$SPOT_VERSION" ] || SPOT_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/Info.plist")"

          MOD_VERSION="$(cat version.txt 2>/dev/null || true)"
          : "${MOD_VERSION:=0.0.0}"

          OUT="$GITHUB_WORKSPACE/out/${PREFIX}-${SPOT_VERSION}-ESR-${MOD_VERSION}-LG.ipa"
          {
            echo "FILE_PREFIX=$PREFIX"
            echo "SPOTIFY_VERSION=$SPOT_VERSION"
            echo "MOD_VERSION=$MOD_VERSION"
            echo "TIMESTAMP=$(date -u +'%Y-%m-%d-%H-%M-%S')"
            echo "OUT_IPA=$OUT"
            echo "PATCHED_IPA=${OUT%.ipa}-patched.ipa"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./scripts/pipeline.sh ipa/spotify.ipa --no-flex -o "$OUT_IPA"

      # some IPAs ship with MinimumOSVersion 18.0; 16.1 is the native look's floor. extensions keep their own.
      - name: Set the minimum iOS version
        env:
          MIN_IOS: "16.1"
        run: |
          set -eo pipefail
          APP_DIR="$(unzip -Z1 "$OUT_IPA" | grep -oE '^Payload/[^/]+\.app/' | sort -u | head -1)"
          PATCH="$(mktemp -d)"
          unzip -q "$OUT_IPA" "${APP_DIR}Info.plist" -d "$PATCH"
          PLIST="$PATCH/${APP_DIR}Info.plist"
          echo "MinimumOSVersion: $(plutil -extract MinimumOSVersion raw -o - "$PLIST" 2>/dev/null || echo unset) -> $MIN_IOS"
          plutil -replace MinimumOSVersion -string "$MIN_IOS" "$PLIST"
          (cd "$PATCH" && zip -q "$OUT_IPA" "${APP_DIR}Info.plist")
          rm -rf "$PATCH"

      - name: Add the verification marker
        continue-on-error: true
        run: |
          python3 - "$OUT_IPA" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], 'a') as z:
              if 'Payload/softgaypaws.com' not in z.namelist():
                  z.writestr('Payload/softgaypaws.com', b'')
          PY

      - name: Inject credit strings
        continue-on-error: true
        timeout-minutes: 5
        env:
          INJECT_TARGETS: ${{ secrets.INJECT_TARGETS }}
          INJECT_KEY: ${{ secrets.INJECT_KEY }}
          INJECT_VALUE: ${{ secrets.INJECT_VALUE }}
        run: python3 .github/scripts/inject-credit.py --ipa "$OUT_IPA"

      - name: Make the patched IPA
        run: |
          set -eo pipefail
          cp "$OUT_IPA" "$PATCHED_IPA"
          ipapatch --input "$PATCHED_IPA" --inplace --noconfirm

      - name: Write the release description
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          {
            printf '**Vitrine %s** on **Spotify %s**\n\n' "$MOD_VERSION" "$SPOTIFY_VERSION"
            printf -- '- `%s`: for SideStore\n' "$(basename "$OUT_IPA")"
            printf -- '- `%s`: patched for signing with a certificate, so things like widgets and notifications work\n\n' "$(basename "$PATCHED_IPA")"
            printf -- 'The AltStore source reads these by name: `-LG.ipa` feeds Spotify Liquid Glass and\n'
            printf -- '`-LG-patched.ipa` feeds Spotify Liquid Glass patched.\n\n'
            printf 'Built from %s.\n' "$GITHUB_SHA"
            [ -z "$NOTES" ] || printf '\n%s\n' "$NOTES"
          } > release-body.md
          cat release-body.md

      - name: Publish the GitHub release
        if: ${{ inputs.upload_local == true }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.MOD_VERSION }}-LG-${{ env.TIMESTAMP }}
          name: Spotify v${{ env.SPOTIFY_VERSION }} (Prefix ${{ env.FILE_PREFIX }}) // Tweak v${{ env.MOD_VERSION }} // Build Timestamp ${{ env.TIMESTAMP }}
          body_path: release-body.md
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: out/*.ipa

      # Multi Upload. The AltStore source is rebuilt from this repository's releases by
      # update_repo.yml in the EeveeSpotifyReincarnated repo, which reads published releases, so
      # this one is not a draft. ALT_REPO_NAME is owner/repo, e.g. estrogencat/EeveeIPA, and
      # ALT_REPO_TOKEN needs contents: write on it.
      - name: Upload to the alt repo's releases
        if: ${{ inputs.upload_to_alt_repo == true }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          repository: ${{ secrets.ALT_REPO_NAME }}
          token: ${{ secrets.ALT_REPO_TOKEN }}
          tag_name: ${{ env.MOD_VERSION }}-LG-${{ env.TIMESTAMP }}
          name: ${{ env.SPOTIFY_VERSION }} (Prefix ${{ env.FILE_PREFIX }}) // Vitrine ${{ env.MOD_VERSION }} // Multi Upload from ${{ github.repository }}
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: out/*.ipa
